name: Build
on:
  push:
    branches:
      - develop
      - master
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      # CauldronWitchery is not on SonarCloud yet. To add analysis, create the project,
      # add the SONAR_TOKEN secret and sonar.* properties to pom.xml, and append
      # org.sonarsource.scanner.maven:sonar-maven-plugin:sonar as in BSkyBlock.
      - name: Build and test
        run: mvn -B verify
